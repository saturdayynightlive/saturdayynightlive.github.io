<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Hwan Ji is a Computer Science & Engineering undergraduate at Seoul National University interested in machine learning and AI."
  />
  <link rel="canonical" href="https://saturdayynightlive.github.io/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hwan Ji" />
  <meta
    property="og:description"
    content="Computer Science & Engineering undergraduate at Seoul National University."
  />
  <meta property="og:url" content="https://saturdayynightlive.github.io/" />
  <title>Hwan Ji</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #171717;
      background: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    main {
      width: min(100% - 40px, 680px);
      margin: 0 auto;
      padding: 18vh 0 12vh;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .intro {
      max-width: 580px;
      margin: 18px 0 0;
      color: #444;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-top: 28px;
    }

    a {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    a:hover {
      color: #555;
    }

    section {
      margin-top: 72px;
    }

    h2 {
      margin: 0 0 8px;
      color: #777;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .work {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid #dedede;
    }

    .work li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: baseline;
      padding: 18px 0;
      border-bottom: 1px solid #dedede;
    }

    .work strong {
      display: block;
      margin-bottom: 4px;
      font-size: 1rem;
    }

    .work span {
      color: #666;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .work-links {
      display: flex;
      gap: 14px;
      white-space: nowrap;
      font-size: 0.9rem;
    }

    @media (max-width: 560px) {
      main {
        padding-top: 12vh;
      }

      .work li {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Hwan Ji</h1>
      <p class="intro">
        Computer Science &amp; Engineering undergraduate at Seoul National University.
        Interested in machine learning and AI.
      </p>
      <nav aria-label="Profile links">
        <a href="mailto:saturdayynightlive@snu.ac.kr">Email</a>
        <a href="https://github.com/saturdayynightlive" target="_blank" rel="noopener">GitHub</a>
        <a href="Hwan_Ji_CV.pdf">CV</a>
      </nav>
    </header>

    <section aria-labelledby="selected-work">
      <h2 id="selected-work">Selected work</h2>
      <ul class="work">
        <li>
          <div>
            <strong>Simply5x5</strong>
            <span>iOS workout tracker built with SwiftUI.</span>
          </div>
          <div class="work-links">
            <a href="projects/simply5x5.html">Details</a>
            <a href="https://apps.apple.com/us/app/simply5x5/id6752772279" target="_blank" rel="noopener">App Store</a>
          </div>
        </li>
        <li>
          <div>
            <strong>Study notes</strong>
            <span>Course summaries and paper notes.</span>
          </div>
          <div class="work-links">
            <a href="docs/">Browse</a>
          </div>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
